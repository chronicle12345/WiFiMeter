<!doctype html>
<html lang="zh-CN" data-palette="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WiFiMeter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-shape="bar" data-palette="dark" data-collapsed="false" data-expanded="false">
    <div class="edge-strip" aria-hidden="true"></div>
    <main title="按住空白区域拖动窗口">
        <header class="mini-heading"><span class="activity-dot"></span><span>WiFiMeter<span class="all-traffic-label"> · 全部流量</span></span></header>
        <div class="rates">
            <div class="rate-download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14m-5-5 5 5 5-5"/></svg><output id="download" aria-label="下载速度"><span class="rate-number">—</span><span class="rate-unit"></span></output></div>
            <div class="rate-upload"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V6m-5 5 5-5 5 5"/></svg><output id="upload" aria-label="上传速度"><span class="rate-number">—</span><span class="rate-unit"></span></output></div>
        </div>
        <nav aria-label="小窗操作"><button id="apps" aria-label="展开应用流量" title="展开应用流量" aria-controls="appsPanel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/></svg></button><button id="open" aria-label="打开主窗口" title="打开主窗口"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6m0-6-9 9M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/></svg></button><button id="close" aria-label="关闭小窗" title="关闭小窗"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></nav>
        <section id="appsPanel" class="apps-panel" aria-label="应用流量列表" hidden>
            <div class="range-controls">
                <label for="range">累计时段</label>
                <select id="range" aria-label="应用流量累计时段"><option value="1m">最近 1 分钟</option><option value="5m">最近 5 分钟</option><option value="1h">最近 1 小时</option><option value="custom">自定义</option></select>
                <label id="customRange" class="custom-range" hidden><input id="customMinutes" type="number" min="1" max="10080" step="1" value="5" aria-label="自定义分钟数"><span>分钟</span></label>
            </div>
            <p id="rangeSummary" class="range-summary">按分钟汇总，正在读取时段</p>
            <p id="appsStatus" class="apps-status" role="status">正在读取应用流量</p>
            <button id="enableCollection" class="enable-collection" hidden>在主窗口启用应用采集</button>
            <div id="tableWrap" class="app-table-wrap" hidden>
                <table aria-label="各应用实时速度与时段累计流量">
                    <thead><tr><th scope="col">应用</th><th scope="col">下载<br><span>KB/s</span></th><th scope="col">上传<br><span>KB/s</span></th><th scope="col">累计下载</th><th scope="col">累计上传</th></tr></thead>
                    <tbody id="appRows"></tbody>
                </table>
            </div>
            <p id="miniError" class="mini-error" role="alert" hidden></p>
        </section>
    </main>
    <script type="module" src="renderer.js"></script>
</body>
</html>

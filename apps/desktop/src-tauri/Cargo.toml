[package]
name = "wifimeter-desktop"
version = "1.2.2"
edition = "2021"
license = "MIT"
description = "WiFiMeter Windows desktop shell"

[features]
test-fixture = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "protocol-fixture"
path = "tests/support/protocol_fixture.rs"
required-features = ["test-fixture"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

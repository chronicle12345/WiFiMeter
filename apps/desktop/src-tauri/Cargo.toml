[package]
name = "wifimeter-desktop"
version = "1.2.2"
edition = "2021"
license = "MIT"
description = "WiFiMeter Windows desktop shell"
default-run = "WiFiMeter"

[features]
test-fixture = []
desktop-shell = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]
custom-protocol = ["desktop-shell", "tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", optional = true, features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[build-dependencies]
tauri-build = "2"

[[bin]]
name = "WiFiMeter"
path = "src/main.rs"
required-features = ["desktop-shell"]

[[bin]]
name = "protocol-fixture"
path = "tests/support/protocol_fixture.rs"
required-features = ["test-fixture"]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

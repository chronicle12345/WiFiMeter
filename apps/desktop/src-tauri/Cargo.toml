[package]
name = "wifimeter"
version = "1.3.0"
description = "WiFiMeter desktop host"
authors = ["WiFiMeter contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3", "common-controls-v6"] }
open = "=5.3.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

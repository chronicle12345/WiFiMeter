name: Legacy Windows build and tests

on:
  push:
    # Tag pushes are handled by release.yml. Listing branches here keeps a tag push
    # from running the same build and tests twice.
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: legacy/windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build application and installer
        shell: powershell
        run: ./tools/Build.ps1
      # The interface and host suites need an interactive desktop, which a hosted
      # agent does not provide. They are skipped here and run on a signed-in machine.
      - name: Run tests
        shell: powershell
        run: ./tests/Run-All.ps1 -SkipDesktopTests
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs
          # The whole tree, not just artifacts/test-results: a failed installer run
          # also leaves status.json, collector.log and the preserved fixture behind.
          path: legacy/windows/artifacts/
          if-no-files-found: ignore
      - name: Upload release files
        uses: actions/upload-artifact@v7
        with:
          name: WiFiMeter-Legacy-Windows
          path: |
            legacy/windows/dist/WiFiMeter-Setup.exe
            legacy/windows/dist/WiFiMeter-Portable.zip

  #           ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
  #         if-no-files-found: ignore
  #         retention-days: 14

  required:
    name: Required Tauri checks
    if: always()
    # needs: [metadata, renderer, windows, linux]
    needs: [metadata, renderer, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail on any failed, cancelled or skipped required job
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          RENDERER_RESULT: ${{ needs.renderer.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          # LINUX_RESULT: ${{ needs.linux.result }}
          SOURCE_RUN_ID: ${{ needs.metadata.outputs.source_run_id }}
        run: |
          test "$METADATA_RESULT" = success
          if [ -n "$SOURCE_RUN_ID" ]; then
            test "$RENDERER_RESULT" = skipped
            test "$WINDOWS_RESULT" = skipped
            # test "$LINUX_RESULT" = skipped
          else
            test "$RENDERER_RESULT" = success
            test "$WINDOWS_RESULT" = success
            # test "$LINUX_RESULT" = success
          fi

  publish:
    name: Publish verified Windows x64 Tauri v1.3 release
    # needs: [metadata, renderer, windows, linux, required]
    needs: [metadata, renderer, windows, required]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.3.') && needs.required.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Recheck the tag, versions and release notes
        id: metadata
        run: node packaging/tauri/release.cjs metadata
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          # Restore these inputs when multi-platform releases resume.
          # pattern: tauri-release-*
          # path: ${{ runner.temp }}/tauri-release-artifacts
          # merge-multiple: false
          name: tauri-release-windows-x64
          path: ${{ runner.temp }}/tauri-release-artifacts/tauri-release-windows-x64
          run-id: ${{ needs.metadata.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Require the Windows x64 installer and matching internal SHA-256
        id: assets
        run: node packaging/tauri/release.cjs release-files "$RUNNER_TEMP/tauri-release-artifacts"
      - name: Upload the Windows x64 installer to a draft before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          NOTES_FILE: ${{ steps.metadata.outputs.notes_file }}
          ASSETS_FILE: ${{ steps.assets.outputs.assets_file }}
        run: |
          set -euo pipefail
          mapfile -t assets < "$ASSETS_FILE"
          # The validated list contains installers only; checksum manifests stay in Actions artifacts.
          # Creation fails if this tag already has a release, including a draft.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "WiFiMeter $VERSION" --notes-file "$NOTES_FILE" "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Verify the public Windows x64 download against the internal SHA-256 manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packaging/tauri/verify-public-release.cjs "$RUNNER_TEMP/tauri-release-artifacts"

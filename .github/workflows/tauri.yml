name: Desktop CI and release

on:
  push:
    branches: [main]
    tags: ['v1.3.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  metadata:
    name: Workflow checks and Tauri release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_run_id: ${{ steps.source.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked browser resources for packaging tests
        run: npm ci --prefix apps/desktop --ignore-scripts
      - name: Validate packaging and release helpers
        run: |
          npm run test:packaging:tauri
          node --test .github/workflows/scripts/ci.test.cjs .github/workflows/scripts/legacy-powershell.test.cjs .github/workflows/scripts/tauri-validated-run.test.cjs
      - name: Check workflow syntax with pinned actionlint
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Require matching desktop versions and release tag notes
        id: metadata
        run: node packaging/tauri/release.cjs metadata
      - name: Reuse a verified main build for the same release commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/workflows/scripts/tauri-validated-run.cjs

  windows:
    name: Windows ${{ matrix.arch }} Tauri
    needs: metadata
    if: needs.metadata.outputs.source_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.ci-npm-cache-v1-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            node_arch: x64
            node_version: 22.23.3
            cmake_arch: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-2022
            arch: ia32
            node_arch: x86
            node_version: 22.23.3
            cmake_arch: Win32
            target: i686-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            node_arch: arm64
            node_version: 22.23.3
            cmake_arch: ARM64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node_version }}
          architecture: ${{ matrix.node_arch }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Resolve native paths and installed Visual Studio generator
        run: |
          node .github/workflows/scripts/ci.cjs environment win32 '${{ matrix.arch }}'
          if ($LASTEXITCODE) { throw 'Target Node.js architecture does not match' }
          node --test packaging/tauri/windows-install.test.cjs
          if ($LASTEXITCODE) { throw 'Windows uninstall repair tests failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installed = & $vswhere -latest -products '*' -property installationVersion
          if ($LASTEXITCODE -or -not $installed) { throw 'Visual Studio C++ toolchain is missing' }
          $major = ($installed -split '\.')[0]
          $capabilities = cmake -E capabilities | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Cannot read CMake generators' }
          $generator = $capabilities.generators.name | Where-Object { $_ -match "^Visual Studio $major " } | Select-Object -First 1
          if (-not $generator) { throw 'CMake does not support the installed Visual Studio version' }
          "CMAKE_GENERATOR=$generator" >> $env:GITHUB_ENV
          rustup target add '${{ matrix.target }}'
          if ($LASTEXITCODE) { throw 'Rust target installation failed' }
          $tauriRustVersion = rustc --version
          if ($LASTEXITCODE) { throw 'Rust compiler version check failed' }
          "TAURI_RUST_VERSION=$tauriRustVersion" >> $env:GITHUB_ENV
      - name: Cache Rust dependencies and compiled targets
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target/**/deps
            apps/desktop/src-tauri/target/**/.fingerprint
            apps/desktop/src-tauri/target/**/build
            apps/desktop/src-tauri/target/.rustc_info.json
          key: tauri-rust-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ env.TAURI_RUST_VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: tauri-rust-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ env.TAURI_RUST_VERSION }}-
      - name: Install locked desktop dependencies
        run: |
          if ('${{ matrix.arch }}' -eq 'ia32') {
            npm ci --prefix apps/desktop --ignore-scripts
          } else {
            npm ci --prefix apps/desktop
          }
          if ($LASTEXITCODE) { throw 'npm ci failed' }
      - name: Install the locked native Electron fixture runtime
        if: matrix.arch != 'ia32'
        run: |
          # Electron 44 exposes an explicit installer instead of an npm postinstall script.
          node apps/desktop/node_modules/electron/install.js
          if ($LASTEXITCODE) { throw 'Electron fixture runtime installation failed' }
          node -e "require('./packaging/targets.cjs').assertArchitecture(require('./apps/desktop/node_modules/electron'), 'win32', process.arch)"
      - name: Download pinned official ia32 Electron fixture runtime
        if: matrix.arch == 'ia32'
        id: ia32_runtime
        run: node .github/workflows/scripts/install-electron-ia32.cjs download
      - name: Activate Electron 43 for ia32 renderer regression tests
        if: matrix.arch == 'ia32'
        env:
          ELECTRON_ARCHIVE: ${{ steps.ia32_runtime.outputs.archive }}
          ELECTRON_DIRECTORY: ${{ steps.ia32_runtime.outputs.directory }}
        run: |
          Expand-Archive -LiteralPath $env:ELECTRON_ARCHIVE -DestinationPath $env:ELECTRON_DIRECTORY -Force
          node .github/workflows/scripts/install-electron-ia32.cjs activate $env:ELECTRON_DIRECTORY
      - name: Ensure WebView2 Runtime for packaged integration tests
        timeout-minutes: 5
        run: |
          # https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/distribution
          function Get-WebView2RuntimeVersion {
            $clientId = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            $registryPaths = @(
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$clientId",
              "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$clientId",
              "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$clientId"
            )
            foreach ($registryPath in $registryPaths) {
              $rawVersion = (Get-ItemProperty -LiteralPath $registryPath -Name pv -ErrorAction SilentlyContinue).pv
              [version]$parsedVersion = $null
              if ([version]::TryParse([string]$rawVersion, [ref]$parsedVersion) -and $parsedVersion -gt [version]'0.0.0.0') { return $parsedVersion }
            }
            return $null
          }
          $runtimeVersion = Get-WebView2RuntimeVersion
          if (-not $runtimeVersion) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper -TimeoutSec 120
            $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)O=Microsoft Corporation(,|$)') {
              throw 'The WebView2 Bootstrapper must have a valid Microsoft Corporation signature'
            }
            $runtimeInstall = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($runtimeInstall.ExitCode -ne 0) { throw "WebView2 Runtime installer exited with code $($runtimeInstall.ExitCode)" }
            $runtimeVersion = Get-WebView2RuntimeVersion
          }
          if (-not $runtimeVersion) { throw 'WebView2 Runtime was not detected after installation' }
          Write-Host "WebView2 Runtime version: $runtimeVersion"
      - name: Build and test the native backend
        run: |
          cmake -S backend -B $env:BUILD_DIR -G $env:CMAKE_GENERATOR -A '${{ matrix.cmake_arch }}' -DWIFIMETER_BUILD_TESTS=ON
          if ($LASTEXITCODE) { throw 'Backend configuration failed' }
          cmake --build $env:BUILD_DIR --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Backend build failed' }
          ctest --test-dir $env:BUILD_DIR -C Release --output-on-failure --no-tests=error
          if ($LASTEXITCODE) { throw 'Backend tests failed' }
          node .github/workflows/scripts/ci.cjs backend win32 '${{ matrix.arch }}' "$env:BUILD_DIR/app"
      - name: Require actual native ETW and TCP EStats capture
        run: |
          python backend/tests/windows_app_capture_smoke.py "$env:BUILD_DIR/app/wifimeter-app-capture.exe" --require-native
          if ($LASTEXITCODE) { throw 'Native ETW capture failed' }
          & (Join-Path $env:GITHUB_WORKSPACE "$env:BUILD_DIR/tests/Release/windows_estats_smoke_test.exe")
          if ($LASTEXITCODE -ne 0) { throw 'Native TCP EStats capture failed; a skip is not a pass' }
      - name: Desktop unit and renderer regression tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/tauri-ui.json
        run: |
          npm run test:unit
          if ($LASTEXITCODE) { throw 'Unit tests failed' }
          npm run test:ui -- '^(?!.*packaging\.spec\.js$).*\.spec\.js$' --workers=2 --reporter=list,json --output "$env:RUNNER_TEMP/playwright-tauri"
          if ($LASTEXITCODE) { throw 'Renderer tests failed' }
          node .github/workflows/scripts/ci.cjs ui-report $env:PLAYWRIGHT_JSON_OUTPUT_NAME
          if ($LASTEXITCODE) { throw 'Renderer tests must all execute and pass' }
      - name: Validate the official Node runtime and NSIS extraction tool
        run: |
          node packaging/tauri/lean-node-check.cjs
          if ($LASTEXITCODE) { throw 'Official Node runtime validation failed' }
          node -e "require('./packaging/tauri/prepare.cjs').nodeLicense(); require('./packaging/tauri/verify-windows.cjs').sevenZipExecutable()"
          if ($LASTEXITCODE) { throw 'Node license or 7-Zip lookup failed' }
      - name: Build only the Tauri NSIS installer
        run: node packaging/tauri/build.cjs --platform win32 --arch '${{ matrix.arch }}' --target '${{ matrix.target }}' --formats nsis --skip-backend
      - name: Rust host tests on the target architecture
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol --target '${{ matrix.target }}' --locked
      - name: Validate the extracted installer in native WebView2
        run: node packaging/tauri/verify-windows.cjs --arch '${{ matrix.arch }}' --target '${{ matrix.target }}'
      - name: Stage verified installer and internal checksum
        id: stage
        run: node packaging/tauri/release.cjs stage win32 '${{ matrix.arch }}' $env:OUTPUT_DIR
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tauri-release-windows-${{ matrix.arch }}
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Tauri integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tauri-diagnostics-windows-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/playwright-tauri/
            ${{ runner.temp }}/tauri-ui.json
            build/tauri-smoke/**
            build/tauri-package-check-*/result.json
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }} Tauri
    needs: metadata
    if: needs.metadata.outputs.source_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Resolve native paths and Rust target
        run: |
          node .github/workflows/scripts/ci.cjs environment linux '${{ matrix.arch }}'
          rustup target add '${{ matrix.target }}'
          tauri_rust_version=$(rustc --version)
          echo "TAURI_RUST_VERSION=$tauri_rust_version" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies and compiled targets
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target/**/deps
            apps/desktop/src-tauri/target/**/.fingerprint
            apps/desktop/src-tauri/target/**/build
            apps/desktop/src-tauri/target/.rustc_info.json
          key: tauri-rust-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ env.TAURI_RUST_VERSION }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/desktop/src-tauri/Cargo.toml') }}
          restore-keys: tauri-rust-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ env.TAURI_RUST_VERSION }}-
      - name: Install native backend, Tauri and integration dependencies
        run: bash .github/workflows/scripts/tauri-linux-deps.sh
      - name: Install locked desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Install the locked native Electron fixture runtime
        run: |
          # Electron 44 exposes an explicit installer instead of an npm postinstall script.
          node apps/desktop/node_modules/electron/install.js
          node -e "require('./packaging/targets.cjs').assertArchitecture(require('./apps/desktop/node_modules/electron'), 'linux', process.arch)"
      - name: Build and test with the Ubuntu 22.04 compatibility baseline
        run: |
          cmake -S backend -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release -DWIFIMETER_BUILD_TESTS=ON -DWIFIMETER_LINUX_APP_CAPTURE=ON \
            -DWIFIMETER_BPF_CLANG=/usr/bin/clang-14 -DWIFIMETER_LIBBPF_INCLUDE_DIR="$TAURI_LIBBPF_INCLUDE" -DWIFIMETER_LIBBPF_LIBRARY="$TAURI_LIBBPF_LIBRARY"
          cmake --build "$BUILD_DIR" --parallel 2
          ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error -E '^linux_app_capture_smoke$'
          node .github/workflows/scripts/ci.cjs backend linux '${{ matrix.arch }}' "$BUILD_DIR/app"
      - name: Require actual native eBPF capture
        run: sudo python3 backend/tests/linux_app_capture_smoke.py "$BUILD_DIR/app/wifimeter-app-capture"
      - name: Desktop unit and renderer regression tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/tauri-ui.json
        run: |
          npm run test:unit
          sudo chown root:root apps/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 apps/desktop/node_modules/electron/dist/chrome-sandbox
          dbus-run-session -- xvfb-run -a npm run test:ui -- '^(?!.*packaging\.spec\.js$).*\.spec\.js$' --workers=2 --reporter=list,json --output "$RUNNER_TEMP/playwright-tauri"
          node .github/workflows/scripts/ci.cjs ui-report "$PLAYWRIGHT_JSON_OUTPUT_NAME"
      - name: Validate the official Node runtime and locate its license
        run: |
          node packaging/tauri/lean-node-check.cjs
          node -e "const fs = require('node:fs'), path = require('node:path'); const license = require('./packaging/tauri/prepare.cjs').nodeLicense({ license: path.resolve(path.dirname(process.execPath), '..', 'LICENSE') }); fs.appendFileSync(process.env.GITHUB_ENV, 'WIFIMETER_NODE_LICENSE=' + license + '\n')"
      - name: Build Tauri deb, rpm and AppImage packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: node packaging/tauri/build.cjs --platform linux --arch '${{ matrix.arch }}' --target '${{ matrix.target }}' --formats deb,rpm,appimage --skip-backend
      - name: Rust host tests on the target architecture
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol --target '${{ matrix.target }}' --locked
      - name: Install pinned Tauri WebDriver
        run: cargo install tauri-driver --version 2.0.5 --locked
      - name: Validate every extracted package in native WebKitGTK
        run: node packaging/tauri/verify-linux.cjs --arch '${{ matrix.arch }}' --target '${{ matrix.target }}'
      - name: Stage verified packages and internal checksum
        id: stage
        run: node packaging/tauri/release.cjs stage linux '${{ matrix.arch }}' "$OUTPUT_DIR"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tauri-release-linux-${{ matrix.arch }}
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload Tauri integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: tauri-diagnostics-linux-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/playwright-tauri/
            ${{ runner.temp }}/tauri-ui.json
            build/tauri-smoke/**
            build/tauri-package-check-*/result.json
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: Required Tauri checks
    if: always()
    needs: [metadata, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail on any failed, cancelled or skipped required job
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
          SOURCE_RUN_ID: ${{ needs.metadata.outputs.source_run_id }}
        run: |
          test "$METADATA_RESULT" = success
          if [ -n "$SOURCE_RUN_ID" ]; then
            test "$WINDOWS_RESULT" = skipped
            test "$LINUX_RESULT" = skipped
          else
            test "$WINDOWS_RESULT" = success
            test "$LINUX_RESULT" = success
          fi

  publish:
    name: Publish verified multi-platform Tauri v1.3 release
    needs: [metadata, windows, linux, required]
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.3.') && needs.required.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.3
      - name: Recheck the tag, versions and release notes
        id: metadata
        run: node packaging/tauri/release.cjs metadata
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: tauri-release-*
          path: ${{ runner.temp }}/tauri-release-artifacts
          merge-multiple: false
          run-id: ${{ needs.metadata.outputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Require all five matrices, nine installers and matching internal SHA-256
        id: assets
        run: node packaging/tauri/release.cjs release-files "$RUNNER_TEMP/tauri-release-artifacts"
      - name: Upload all installers to a draft before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          NOTES_FILE: ${{ steps.metadata.outputs.notes_file }}
          ASSETS_FILE: ${{ steps.assets.outputs.assets_file }}
        run: |
          set -euo pipefail
          mapfile -t assets < "$ASSETS_FILE"
          # The validated list contains installers only; checksum manifests stay in Actions artifacts.
          # Creation fails if this tag already has a release, including a draft.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "WiFiMeter $VERSION" --notes-file "$NOTES_FILE" "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
      - name: Verify nine public downloads against the internal SHA-256 manifests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packaging/tauri/verify-public-release.cjs "$RUNNER_TEMP/tauri-release-artifacts"

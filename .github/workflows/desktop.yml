name: Integration CI and release

on:
  push:
    branches: [main, cross-platform, integration-1.2.0, 'feature/**']
    tags: ['v1.2.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  metadata:
    name: Workflow checks and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
      - name: Validate workflow helpers
        run: node --test .github/workflows/scripts/ci.test.cjs
      - name: Check workflow syntax with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - id: metadata
        name: Read package version and require matching tag notes
        run: node .github/workflows/scripts/ci.cjs metadata

  windows:
    name: Windows matrix
    needs: metadata
    uses: ./.github/workflows/windows-app.yml
    permissions:
      contents: read

  linux:
    name: Linux ${{ matrix.arch }} native tests and packages
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: 3.13.7
          architecture: ${{ matrix.arch }}
      - name: Resolve native paths
        run: node .github/workflows/scripts/ci.cjs environment linux "${{ matrix.arch }}"
      - name: Install dependencies from the fixed Ubuntu snapshot
        run: bash .github/workflows/scripts/linux-deps.sh
      - name: Install locked desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Build and test with the Ubuntu 22.04 compatibility baseline
        run: |
          docker run --rm --env HOST_UID="$(id -u)" --env HOST_GID="$(id -g)" --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02 bash .github/workflows/scripts/linux-build-baseline.sh "${{ matrix.arch }}"
      - name: Re-run backend tests on the native host
        run: |
          ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error -E '^linux_app_capture_smoke$'
          node .github/workflows/scripts/ci.cjs backend linux "${{ matrix.arch }}" "$BUILD_DIR/app"
      - name: Require actual native eBPF capture
        # 不把 CTest 的 SKIP_RETURN_CODE=77 当成原生采集验证成功。
        run: sudo "$(command -v python)" backend/tests/linux_app_capture_smoke.py "$BUILD_DIR/app/wifimeter-app-capture"
      - name: Desktop unit tests with the native backend
        run: npm --prefix apps/desktop run test:unit
      - name: Full fixture UI tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/ui-development.json
        run: |
          sudo chown root:root apps/desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 apps/desktop/node_modules/electron/dist/chrome-sandbox
          dbus-run-session -- xvfb-run -a npm --prefix apps/desktop run test:ui -- desktop.spec.js renderer-backend.spec.js renderer-history.spec.js --reporter=list,json --output "$RUNNER_TEMP/playwright-development"
          node .github/workflows/scripts/ci.cjs ui-report "$PLAYWRIGHT_JSON_OUTPUT_NAME"
      - name: Build deb, rpm and AppImage
        run: node packaging/linux/build.cjs --arch "${{ matrix.arch }}" --formats deb,rpm,AppImage --skip-rebuild
      - name: Extract every package and verify native backend and fixture UI
        run: bash .github/workflows/scripts/linux-packages.sh "${{ matrix.arch }}"
      - name: Verify the packaged directory without a backend path override
        run: |
          sudo chown root:root "$UNPACKED_DIR/chrome-sandbox"
          sudo chmod 4755 "$UNPACKED_DIR/chrome-sandbox"
          dbus-run-session -- xvfb-run -a node .github/workflows/scripts/smoke-discovery.cjs
      - name: Stage only fully verified release assets
        id: stage
        run: node .github/workflows/scripts/ci.cjs stage linux "${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload failure diagnostics separately from release assets
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/ui-*.json
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/playwright-*/
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required integration checks
    if: ${{ always() }}
    needs: [metadata, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail on any failed, cancelled or skipped required job
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          test "$METADATA_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$LINUX_RESULT" = success

  publish:
    name: Publish verified v1.2 release
    needs: [metadata, windows, linux, required]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.2.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: false
      - name: Require all five matrices, twelve assets and matching SHA-256
        id: assets
        run: node .github/workflows/scripts/ci.cjs release-files "$RUNNER_TEMP/release-artifacts"
      - name: Publish using only this workflow's GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          ASSETS_FILE: ${{ steps.assets.outputs.assets_file }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${RELEASE_TAG}.md"
          test -s "$notes_file"
          mapfile -t assets < "$ASSETS_FILE"
          # 先完整上传草稿，再公开；失败时不公开部分产物，也不覆盖已有 release。
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "WiFiMeter $VERSION" --notes-file "$notes_file" "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false

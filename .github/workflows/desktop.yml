name: Integration CI and release

on:
  push:
    branches: [main, cross-platform, integration-1.2.0, 'feature/**']
    tags: ['v1.2.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  metadata:
    name: Workflow checks and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - name: Validate workflow helpers
        run: node --test .github/scripts/ci.test.cjs
      - name: Check workflow syntax with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - id: metadata
        name: Read package version and require matching tag notes
        run: node .github/scripts/ci.cjs metadata

  windows:
    name: Windows matrix
    needs: metadata
    uses: ./.github/workflows/windows-app.yml
    permissions:
      contents: read

  linux:
    name: Linux ${{ matrix.arch }} native tests and packages
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Resolve native paths
        run: node .github/scripts/ci.cjs environment linux "${{ matrix.arch }}"
      - name: Install dependencies from the fixed Ubuntu snapshot
        run: bash .github/scripts/linux-deps.sh
      - name: Install locked desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Build native collectors and Tauri test host
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          cmake -S backend -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Release -DWIFIMETER_LINUX_APP_CAPTURE=ON -DWIFIMETER_BPF_CLANG=clang-18
          cmake --build "$BUILD_DIR" --parallel 2
          ctest --test-dir "$BUILD_DIR" --output-on-failure --no-tests=error -E '^linux_app_capture_smoke$'
          sudo python3 backend/tests/linux_app_capture_smoke.py "$BUILD_DIR/app/wifimeter-app-capture"
          npm --prefix apps/desktop run build:frontend
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features test-fixture -- --include-ignored
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features custom-protocol,test-fixture --bin WiFiMeter
      - name: Unit and browser regression tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/ui-development.json
        run: |
          npm run test:unit
          npm --prefix apps/desktop exec -- playwright install chromium
          npm --prefix apps/desktop run test:ui -- --reporter=list,json
          node .github/scripts/ci.cjs ui-report "$PLAYWRIGHT_JSON_OUTPUT_NAME"
      - name: Real WebKitGTK test
        run: |
          export WIFIMETER_EXECUTABLE="$GITHUB_WORKSPACE/apps/desktop/src-tauri/target/debug/WiFiMeter"
          dbus-run-session -- xvfb-run -a node apps/desktop/tests/e2e/smoke-linux.mjs
      - name: Build and verify the final deb package
        run: |
          ./packaging/build-linux.sh --arch "${{ matrix.arch }}" --formats deb --skip-rebuild
          bash .github/scripts/linux-packages.sh "${{ matrix.arch }}"
      - name: Stage only fully verified release assets
        id: stage
        run: node .github/scripts/ci.cjs stage linux "${{ matrix.arch }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-linux-${{ matrix.arch }}
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload failure diagnostics separately from release assets
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostics-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/ui-*.json
            ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/playwright-*/
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required integration checks
    if: ${{ always() }}
    needs: [metadata, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail on any failed, cancelled or skipped required job
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          test "$METADATA_RESULT" = success
          test "$WINDOWS_RESULT" = success
          test "$LINUX_RESULT" = success

  publish:
    name: Publish verified v1.2 release
    needs: [metadata, windows, linux, required]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v1.2.') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-artifacts
          merge-multiple: false
      - name: Require all three matrices, four assets and matching SHA-256
        id: assets
        run: node .github/scripts/ci.cjs release-files "$RUNNER_TEMP/release-artifacts"
      - name: Publish using only this workflow's GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
          ASSETS_FILE: ${{ steps.assets.outputs.assets_file }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${RELEASE_TAG}.md"
          test -s "$notes_file"
          combined_notes="$RUNNER_TEMP/release-notes.md"
          cat "$notes_file" > "$combined_notes"
          printf '\n\n' >> "$combined_notes"
          mapfile -t assets < "$ASSETS_FILE"
          # 先完整上传草稿，再公开；失败时不公开部分产物，也不覆盖已有 release。
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "WiFiMeter $VERSION" --notes-file "$combined_notes" "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false

name: Original 1.1.1 PowerShell portable

on:
  workflow_call:

permissions:
  contents: read

jobs:
  portable:
    name: Build unchanged 1.1.1 / PowerShell
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Export pinned v1.1.1 and run its original build
        id: build
        shell: powershell
        run: ./.github/workflows/scripts/build-legacy-powershell.ps1 -OutputDirectory "$env:RUNNER_TEMP/legacy-powershell"
      - name: Run original non-desktop tests
        shell: powershell
        env:
          LEGACY_SOURCE: ${{ steps.build.outputs.source }}
        run: |
          & "$env:LEGACY_SOURCE/tests/Run-All.ps1" -SkipDesktopTests
          if ($LASTEXITCODE -ne 0) { throw 'Original 1.1.1 tests failed.' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: legacy-powershell-1.1.1
          path: |
            ${{ runner.temp }}/legacy-powershell/WiFiMeter-1.1.1-PowerShell-windows-Portable.zip
            ${{ runner.temp }}/legacy-powershell/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

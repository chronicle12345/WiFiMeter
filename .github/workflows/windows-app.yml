name: Windows cross build and native tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cross:
    name: Build Windows x64 on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc-posix
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: bash .github/scripts/linux-deps.sh
      - run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add x86_64-pc-windows-gnu
          npm ci --prefix apps/desktop
      - name: Build collectors, core tests and debug WebView2 host
        run: |
          node packaging/windows/build-backend.mjs --tests
          npm --prefix apps/desktop run build:frontend
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-gnu --features test-fixture --no-run --message-format=json > .cross-build/windows-rust-tests.jsonl
          node .github/scripts/windows-rust-tests.mjs stage .cross-build/windows-rust-tests .cross-build/windows-rust-tests.jsonl
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-gnu --features custom-protocol,test-fixture --bin WiFiMeter
      - name: Build NSIS and portable ZIP
        run: ./packaging/build-windows.sh --skip-rebuild
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-cross-build
          include-hidden-files: true
          path: |
            dist/windows/
            build/windows/app/*.exe
            build/windows/tests/*.exe
            .cross-build/windows-rust-tests/
            apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/debug/WiFiMeter.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/debug/WebView2Loader.dll
          if-no-files-found: error
          retention-days: 7

  native:
    name: Test Linux-built Windows binaries
    needs: cross
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-cross-build
          path: .
      - run: |
          npm ci --prefix apps/desktop
          if ($LASTEXITCODE) { throw 'npm ci failed' }
          node .github/scripts/ci.cjs environment win32 x64
      - name: Native C++ and Rust tests, including real collector tests
        run: |
          $env:WIFIMETER_BACKEND_BINARY = $env:WIFIMETER_BACKEND
          node packaging/windows/run-windows-tests.mjs
          if ($LASTEXITCODE) { throw 'Native backend tests failed' }
          node .github/scripts/windows-rust-tests.mjs run .cross-build/windows-rust-tests
          if ($LASTEXITCODE) { throw 'Native Rust tests failed' }
          npm run test:unit
          if ($LASTEXITCODE) { throw 'Desktop unit tests failed' }
      - name: Real WebView2 UI and native input tests
        run: |
          $env:WIFIMETER_EXECUTABLE = (Resolve-Path 'apps/desktop/src-tauri/target/x86_64-pc-windows-gnu/debug/WiFiMeter.exe').Path
          node apps/desktop/tests/e2e/smoke-windows.mjs
          if ($LASTEXITCODE) { throw 'WebView2 test failed; an unavailable input desktop is not a pass' }
      - name: Verify final portable archive with bundled collector
        run: |
          $version = node -p "require('./apps/desktop/package.json').version"
          $archive = "dist/windows/WiFiMeter-$version-windows-x64-Portable.zip"
          $directory = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive $archive $directory
          $env:WIFIMETER_EXECUTABLE = Join-Path $directory 'win-unpacked/WiFiMeter.exe'
          $env:WIFIMETER_BACKEND = Join-Path $directory 'win-unpacked/wifimeter-backend.exe'
          node apps/desktop/tests/e2e/smoke-package-windows.mjs
          if ($LASTEXITCODE) { throw 'Packaged WebView2 test failed' }
          node .github/scripts/ci.cjs directory win32 x64 "$directory/win-unpacked"
          if ($LASTEXITCODE) { throw 'Packaged resources failed' }
      - name: Stage verified assets
        id: stage
        run: node .github/scripts/ci.cjs stage win32 x64
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-windows-x64
          path: ${{ steps.stage.outputs.directory }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
